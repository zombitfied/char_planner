<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 5e / 2024 - Eingang</title>
    
    <script>
        const savedTheme = localStorage.getItem('dnd_theme') || 'standard';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            box-sizing: border-box;
            padding-bottom: 80px;
        }

        .btn-debug-reset {
            position: fixed;
            top: 16px;
            right: 68px;
            z-index: 1100;
            background: var(--btn-back-bg);
            border: 1.5px solid #8b0000;
            color: #8b0000;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        .btn-debug-reset:hover {
            background: #8b0000;
            color: #fff;
        }

        .menu-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            filter: url(#rough-edge);
        }
        
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            font-family: serif;
            cursor: pointer;
            text-decoration: none;
            margin-top: 12px;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }
        .menu-btn:hover {
            opacity: 0.9;
        }
        .menu-btn.secondary {
            background: var(--btn-back-bg);
            color: var(--text);
            border: 1.5px solid var(--border);
        }

        .character-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--btn-back-bg);
            border: 1.5px solid var(--border);
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .character-list-item:hover {
            border-color: var(--accent);
        }
    </style>
</head>
<body>

<svg style="display:none;" aria-hidden="true">
    <filter id="rough-edge">
        <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
</svg>

<!-- Debug-Reset-Button (Käfer) -->
<button class="btn-debug-reset" onclick="resetLocalStorage()" title="Speicher komplett leeren (Reset)">
    <i class="fa-solid fa-bug"></i>
</button>

<!-- Design-Toggle-Button -->
<button class="btn-theme-toggle" onclick="openThemeModal()" title="Design wählen">
    <i class="fa-solid fa-paintbrush"></i>
</button>

<div class="container">
    <div class="page-title" style="margin-top: 20px; text-align: center;">D&D 5e Heldensuche</div>

    <div class="menu-card">
        <div class="step-title" style="margin-top:0;">Neuer Abenteurer</div>
        <!-- Link zum Erstellen im Create-Modus -->
        <a href="charakter-erstellen.html?mode=create" class="menu-btn">
            <i class="fa-solid fa-feather"></i> Neuen Helden erstellen
        </a>
    </div>

    <div class="menu-card">
        <div class="step-title" style="margin-top:0;">Gespeicherte Helden</div>
        <div id="character-list-container" style="display: flex; flex-direction: column; gap: 4px; margin-top: 10px;">
            <div style="font-size: 0.9rem; color: var(--text-muted); text-align: center; padding: 10px;">Keine Helden gefunden.</div>
        </div>
    </div>
</div>

<!-- DESIGN MODAL -->
<div id="theme-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-title">
            <span>Design wählen</span>
        </div>
        <div class="modal-body" style="overflow: visible;">
            <button class="theme-option-btn" onclick="setTheme('standard')">
                <span><i class="fa-solid fa-scroll" style="color: var(--accent); margin-right: 8px;"></i> Standard (Pergament)</span>
                <i class="fa-solid fa-check" id="check-standard" style="display:none; color: var(--accent);"></i>
            </button>
            <button class="theme-option-btn" onclick="setTheme('dungeon')">
                <span><i class="fa-solid fa-moon" style="color: var(--accent); margin-right: 8px;"></i> Dungeon (Dark Mode)</span>
                <i class="fa-solid fa-check" id="check-dungeon" style="display:none; color: var(--accent);"></i>
            </button>
        </div>
        <button class="btn-gray-main" onclick="closeThemeModal()" style="margin-top: 10px;">Schließen</button>
    </div>
</div>

<script>
window.onload = function() {
    renderSavedCharactersList();
};

function renderSavedCharactersList() {
    const container = document.getElementById('character-list-container');
    const listJson = localStorage.getItem('dnd_character_list');
    
    if (!listJson) return;
    
    try {
        const list = JSON.parse(listJson);
        if (!list || list.length === 0) return;

        container.innerHTML = '';
        list.forEach(char => {
            const item = document.createElement('div');
            item.className = 'character-list-item';
            item.innerHTML = `
                <div>
                    <div style="font-weight: bold; color: var(--text);">${char.name || 'Unbenannter Held'}</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">${char.class} (Stufe ${char.level || 1}) - ${char.species || ''}</div>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: var(--accent);"></i>
            `;
            item.onclick = () => {
                // Setze den angeklickten Helden als aktiv und leite zur Heldenseite (?mode=sheet) weiter
                localStorage.setItem('dnd_active_character', JSON.stringify(char));
                window.location.href = 'charakter-erstellen.html?mode=sheet';
            };
            container.appendChild(item);
        });
    } catch (e) {
        console.error("Fehler beim Laden der Heldenliste", e);
    }
}

function openThemeModal() {
    const current = localStorage.getItem('dnd_theme') || 'standard';
    document.getElementById('check-standard').style.display = current === 'standard' ? 'inline' : 'none';
    document.getElementById('check-dungeon').style.display = current === 'dungeon' ? 'inline' : 'none';
    document.getElementById('theme-modal').style.display = 'flex';
}

function closeThemeModal() {
    document.getElementById('theme-modal').style.display = 'none';
}

function setTheme(themeName) {
    localStorage.setItem('dnd_theme', themeName);
    document.documentElement.setAttribute('data-theme', themeName);
    closeThemeModal();
}

function resetLocalStorage() {
    if (confirm("Möchtest du wirklich den gesamten lokalen Speicher leeren? Alle gespeicherten Helden und Einstellungen gehen verloren.")) {
        localStorage.clear();
        alert("Speicher erfolgreich geleert!");
        location.reload();
    }
}
</script>
</body>
</html>
