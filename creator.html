<script>
const BACKGROUNDS_JSON_URL = "./backgrounds.json";
const SPELLS_HTML_URL = "./spells-parsed.html";
const SPELL_LISTS_HTML_URL = "./spelllists-parsed.html";

const standardArray = [15, 14, 13, 12, 10, 8];

const attributeDescriptions = {
    "STR": "<b>Stärke:</b> Athletik, Nahkampfangriffe, Tragekapazität.",
    "DEX": "<b>Geschicklichkeit:</b> Akrobatik, Fingerfertigkeit, Heimlichkeit, RK, Initiative.",
    "CON": "<b>Konstitution:</b> Trefferpunkte, Konzentrationswürfe.",
    "INT": "<b>Intelligenz:</b> Arkankunde, Geschichte, Untersuchung, Naturkunde, Religion.",
    "WIS": "<b>Weisheit:</b> Tierumgang, Einblick, Heilkunde, Wahrnehmung, Überleben.",
    "CHA": "<b>Charisma:</b> Täuschen, Einschüchtern, Auftreten, Überzeugen."
};

const attrNamesDE = {
    "STR": "Stärke", "DEX": "Geschicklichkeit", "CON": "Konstitution",
    "INT": "Intelligenz", "WIS": "Weisheit", "CHA": "Charisma"
};

// Exakte Zuordnung der deutschen Klassen zu ihren HTML-Dateien im Ordner /klassen/
const classFileMap = {
    "Artifizier": "artifizier.html",
    "Barbar": "barbar.html",
    "Barde": "barde.html",
    "Kleriker": "kleriker.html",
    "Druide": "druide.html",
    "Kämpfer": "kaempfer.html",
    "Mönch": "moench.html",
    "Paladin": "paladin.html",
    "Waldläufer": "waldlaeufer.html",
    "Schurke": "schurke.html",
    "Zauberer": "zauberer.html",
    "Hexenmeister": "hexenmeister.html",
    "Magier": "magier.html"
};

// Fertigkeiten exakt nach den jeweiligen Klassen-HTMLs
const classSkillsData = {
    "Artifizier": ["Arkankunde", "Geschichte", "Untersuchung", "Heilkunde", "Naturkunde", "Wahrnehmung", "Fingerfertigkeit"],
    "Barbar": ["Athletik", "Einschüchtern", "Naturkunde", "Tierumgang", "Überleben", "Wahrnehmung"],
    "Barde": ["Akrobatik", "Auftreten", "Athletik", "Einblick", "Geschichte", "Heimlichkeit", "Täuschen", "Überzeugen", "Wahrnehmung"], // Plus beliebige, hier aus Auswahl
    "Kleriker": ["Einblick", "Geschichte", "Heilkunde", "Religion", "Überzeugen"],
    "Druide": ["Einblick", "Heilkunde", "Naturkunde", "Religion", "Tierumgang", "Überleben", "Wahrnehmung"],
    "Kämpfer": ["Akrobatik", "Athletik", "Einblick", "Einschüchtern", "Geschichte", "Tierumgang", "Überleben", "Wahrnehmung"],
    "Mönch": ["Akrobatik", "Athletik", "Einblick", "Heimlichkeit", "Religion", "Verstohlenheit"],
    "Paladin": ["Athletik", "Einschüchtern", "Heilkunde", "Motiv erkennen", "Religion", "Überzeugen"],
    "Waldläufer": ["Athletik", "Heimlichkeit", "Mit Tieren umgehen", "Motiv erkennen", "Nachforschungen", "Naturkunde", "Überlebenskunst", "Wahrnehmung"],
    "Schurke": ["Akrobatik", "Athletik", "Auftreten", "Einschüchtern", "Fingerfertigkeit", "Heimlichkeit", "Motiv erkennen", "Nachforschungen", "Täuschen", "Überzeugen", "Wahrnehmung"],
    "Zauberer": ["Arkane Kunde", "Einschüchtern", "Motiv erkennen", "Religion", "Täuschen", "Überzeugen"],
    "Hexenmeister": ["Arkankunde", "Einschüchtern", "Geschichte", "Investigation", "Naturkunde", "Religion", "Täuschen"],
    "Magier": ["Arkankunde", "Einblick", "Geschichte", "Investigation", "Medizin", "Religion"]
};

// Trefferwürfel und Basis-HP pro Klasse (aus den Klassen-HTMLs)
const classHpData = {
    "Artifizier": { die: 8, base: 8 },
    "Barbar": { die: 12, base: 12 },
    "Barde": { die: 8, base: 8 },
    "Kleriker": { die: 8, base: 8 },
    "Druide": { die: 8, base: 8 },
    "Kämpfer": { die: 10, base: 10 },
    "Mönch": { die: 8, base: 8 },
    "Paladin": { die: 10, base: 10 },
    "Waldläufer": { die: 10, base: 10 },
    "Schurke": { die: 8, base: 8 },
    "Zauberer": { die: 6, base: 6 },
    "Hexenmeister": { die: 8, base: 8 },
    "Magier": { die: 6, base: 6 }
};

let speciesData = {};
let backgrounds = {};
let skillDescriptions = {};
let spellCompendium = { cantrips: {}, level1: {} };
let weaponsCompendium = {};
let classSpellLists = {};

let currentCalculatedMods = { STR:0, DEX:0, CON:0, INT:0, WIS:0, CHA:0 };
let lastBuiltCharacter = null;
let isSaved = false;

window.onload = async function() {
    try {
        console.log("Lade Basisdaten...");
        // Wir laden die compendium.json nur noch für Rassen, Skills und Waffen, da die Klassen in den HTMLs liegen
        const response = await fetch("./compendium.json?t=" + new Date().getTime());
        if (!response.ok) throw new Error(`HTTP Fehlerstatus: ${response.status}`);
        
        const data = await response.json();
        speciesData = data.speciesData;
        skillDescriptions = data.skills || {};
        weaponsCompendium = data.weapons || {};

        try {
            const bgResponse = await fetch(BACKGROUNDS_JSON_URL + "?t=" + new Date().getTime());
            if (bgResponse.ok) {
                const bgData = await bgResponse.json();
                backgrounds = bgData.backgrounds ? bgData.backgrounds : bgData;
            } else {
                backgrounds = data.backgrounds || {};
            }
        } catch (e) {
            backgrounds = data.backgrounds || {};
        }

        try {
            const spellResponse = await fetch(SPELLS_HTML_URL + "?t=" + new Date().getTime());
            if (spellResponse.ok) parseSpellsHtml(await spellResponse.text());
        } catch (e) {}

        try {
            const listResponse = await fetch(SPELL_LISTS_HTML_URL + "?t=" + new Date().getTime());
            if (listResponse.ok) parseSpellListsHtml(await listResponse.text());
        } catch (e) {}

        initApp();
    } catch (err) {
        alert("Ladefehler: " + err.message);
        console.error("JSON Load Details:", err);
    }
};

function parseSpellsHtml(htmlText) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlText, 'text/html');
    doc.querySelectorAll('.spell').forEach(div => {
        const h5 = div.querySelector('h5');
        if (!h5) return;
        const name = h5.textContent.trim();
        if (div.textContent.includes('Zaubertrick')) spellCompendium.cantrips[name] = { rule: div.innerHTML };
        else if (div.textContent.includes('1. Grades')) spellCompendium.level1[name] = { rule: div.innerHTML };
    });
}

function parseSpellListsHtml(htmlText) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlText, 'text/html');
    doc.querySelectorAll('h4').forEach(h4 => {
        let className = h4.textContent.replace('Zauber des ', '').replace('Zauber der ', '').trim();
        const map = { "Barden": "Barde", "Druiden": "Druide", "Hexenmeisters": "Hexenmeister", "Klerikers": "Kleriker", "Magiers": "Magier", "Paladins": "Paladin", "Waldläufers": "Waldläufer", "Zauberers": "Zauberer" };
        if (map[className]) className = map[className];

        if (!classSpellLists[className]) classSpellLists[className] = { cantrips: [], level1: [] };

        let next = h4.nextElementSibling;
        let lvl = null;
        while (next && next.tagName !== 'H4') {
            if (next.tagName === 'H5') {
                lvl = next.textContent.toLowerCase().includes('zaubertrick') ? 'cantrips' : (next.textContent.toLowerCase().includes('1. grad') ? 'level1' : null);
            } else if (next.tagName === 'UL' && lvl) {
                next.querySelectorAll('a').forEach(a => {
                    let s = a.textContent.trim();
                    if (s && !classSpellLists[className][lvl].includes(s)) classSpellLists[className][lvl].push(s);
                });
            }
            next = next.nextElementSibling;
        }
    });
}

function initApp() {
    populateSelect('main-race', Object.keys(speciesData));
    
    // Fülle Klassen-Dropdown direkt aus der classFileMap (Deutsche Dateinamen/Schlüssel)
    const classSel = document.getElementById('class-select');
    classSel.innerHTML = '';
    Object.keys(classFileMap).forEach(clsName => {
        classSel.innerHTML += `<option value="${clsName}">${clsName}</option>`;
    });

    populateSelect('bg-select', Object.keys(backgrounds));

    const arraySelects = document.querySelectorAll('.array-select');
    arraySelects.forEach((sel, idx) => {
        sel.innerHTML = '<option value="">--</option>';
        standardArray.forEach(val => sel.innerHTML += `<option value="${val}">${val}</option>`);
        sel.selectedIndex = idx + 1;
    });

    onMainRaceChange();
    onClassChange();
    updateBgDynamicUI();

    document.addEventListener('input', markAsUnsaved);
    document.addEventListener('change', markAsUnsaved);
}

function markAsUnsaved() {
    isSaved = false;
    const advBtn = document.getElementById('btn-adventure');
    if (advBtn) {
        advBtn.disabled = true;
        advBtn.style.background = '#cccccc';
        advBtn.style.color = '#666666';
        advBtn.style.cursor = 'not-allowed';
    }
}

function populateSelect(id, items) {
    const sel = document.getElementById(id);
    sel.innerHTML = '';
    items.forEach(i => sel.innerHTML += `<option value="${i}">${i}</option>`);
}

function openModal(title, text, iconClass = null, subtitle = null) {
    const titleElem = document.getElementById('modal-title');
    const subContainer = document.getElementById('modal-subtitle-container');
    
    titleElem.innerHTML = iconClass ? `<span class="modal-icon-box"><i class="fa-solid ${iconClass}"></i></span> ${title}` : title;
    subContainer.innerHTML = subtitle ? `<div class="modal-subtitle">${subtitle}</div>` : '';

    document.getElementById('modal-body').innerHTML = text;
    document.getElementById('rule-modal').style.display = 'flex';
    document.body.classList.add('modal-open');
}

function closeModal() {
    document.getElementById('rule-modal').style.display = 'none';
    document.body.classList.remove('modal-open');
}

function showRaceModal() {
    const mainRace = document.getElementById('main-race').value;
    const subRace = document.getElementById('sub-race').value;
    openModal(subRace, speciesData[mainRace].subraces[subRace].text, "fa-child");
}

async function showClassModal() {
    const clsName = document.getElementById('class-select').value;
    const fileName = classFileMap[clsName];
    if (!fileName) return openModal(clsName, `Keine Klassendatei für ${clsName} hinterlegt.`, getClassIcon(clsName));

    try {
        const response = await fetch(`./klassen/${fileName}?t=` + new Date().getTime());
        if (!response.ok) throw new Error(`HTTP Fehler: ${response.status}`);
        openModal(clsName, await response.text(), getClassIcon(clsName));
    } catch (err) {
        openModal(clsName, `Konnte Datei "klassen/${fileName}" nicht laden!`, getClassIcon(clsName));
    }
}

function showBgModal() {
    const b = document.getElementById('bg-select').value;
    const bg = backgrounds[b];
    if (!bg) return;
    openModal(b, `<b>Mögliche Attribute:</b> ${bg.attributes.map(a => attrNamesDE[a] || a).join(', ')}<br><b>Talent:</b> ${bg.feat}<br><b>Fertigkeiten:</b> ${bg.skills.join(', ')}<br><br>${bg.text}`, "fa-book");
}

function showSkillModal(selectId) {
    const skill = document.getElementById(selectId).value;
    openModal(skill, skillDescriptions[skill] || "Keine Beschreibung verfügbar.", "fa-check");
}

function showSpellModalFromDropdown(selectElem) {
    showSpellModalByName(selectElem.value);
}

function showSpellModalByName(spellName) {
    if (!spellName) return;
    let clean = spellName.replace(/ \((Racial|Auto|.*)\)/, '').trim();
    let obj = spellCompendium.cantrips[clean] || spellCompendium.level1[clean] || spellCompendium.cantrips[spellName] || spellCompendium.level1[spellName];

    if (!obj) return openModal(clean, "Keine detaillierte Beschreibung verfügbar.", "fa-wand-magic-sparkles");

    let temp = document.createElement('div');
    temp.innerHTML = obj.rule;
    if (temp.querySelector('h5')) temp.querySelector('h5').remove();

    let school = "";
    temp.querySelectorAll('p, div').forEach(p => {
        if (p.textContent.includes('Zaubertrick') || p.textContent.includes('Grades')) {
            school = p.textContent.trim();
            p.remove();
        }
    });

    let html = temp.innerHTML;
    ['Zeitaufwand:', 'Reichweite:', 'Komponenten:', 'Wirkungsdauer:'].forEach(k => {
        html = html.replace(new RegExp(`(${k})`, 'gi'), '<b>$1</b>');
    });

    openModal(clean, html, "fa-wand-magic-sparkles", school);
}

function showCalcModal(type) {
    if (!lastBuiltCharacter) return;
    const c = lastBuiltCharacter;
    let text = "";
    if (type === 'HP') text = `Basis (${c.class}): ${c.hp - c.mods.CON}<br>+ Konstitution (${c.mods.CON}): ${c.mods.CON}<br><b>Total: ${c.hp}</b>`;
    else if (type === 'RK') text = `Basis: 10<br>+ Geschicklichkeit (${c.mods.DEX}): ${c.mods.DEX}<br><b>Total: ${c.ac}</b>`;
    else if (type === 'Initiative') text = `Geschicklichkeits-Modifikator: ${c.mods.DEX}`;
    else if (type === 'Übungsbonus') text = `Stufe 1–4 = +2`;
    else if (type === 'Bewegungsrate') text = `${c.speed || 30} Fuß`;
    openModal(type, text, "fa-calculator");
}

function getClassIcon(className) {
    switch (className) {
        case "Artifizier": return "fa-wrench";
        case "Barbar": return "fa-hammer";
        case "Barde": return "fa-guitar";
        case "Kleriker": return "fa-cross";
        case "Druide": return "fa-tree";
        case "Kämpfer": return "fa-shield";
        case "Mönch": return "fa-ring";
        case "Paladin": return "fa-shield";
        case "Waldläufer": return "fa-crosshairs";
        case "Schurke": return "fa-dagger";
        case "Zauberer": return "fa-fire";
        case "Hexenmeister": return "fa-star-of-life";
        case "Magier": return "fa-hat-wizard";
        default: return "fa-user";
    }
}

function updateClassIconDisplay() {
    const c = document.getElementById('class-select').value;
    const iconElem = document.getElementById('class-icon-indicator');
    if (iconElem) iconElem.className = `fa-solid ${getClassIcon(c)}`;
}

function onMainRaceChange() {
    const mainRace = document.getElementById('main-race').value;
    const subContainer = document.getElementById('subrace-container');
    const subSelect = document.getElementById('sub-race');

    subSelect.innerHTML = '';
    Object.keys(speciesData[mainRace].subraces).forEach(subKey => {
        subSelect.innerHTML += `<option value="${subKey}">${subKey}</option>`;
    });
    subContainer.style.display = 'block';
    updateSubraceOptions();
}

function updateSubraceOptions() {
    const mainRace = document.getElementById('main-race').value;
    const raceData = speciesData[mainRace];
    const specialContainer = document.getElementById('special-attr-container');
    const specialSelect = document.getElementById('special-attr-select');

    if (raceData && raceData["spezial-attribut"] && raceData["spezial-attribut"].spellcasting) {
        specialSelect.innerHTML = '';
        raceData["spezial-attribut"].spellcasting.forEach(opt => specialSelect.innerHTML += `<option value="${opt}">${opt}</option>`);
        specialContainer.style.display = 'block';
    } else {
        specialContainer.style.display = 'none';
    }
    updateSpellsUI();
}

function onClassChange() {
    const clsName = document.getElementById('class-select').value;
    updateClassIconDisplay();

    const s1 = document.getElementById('skill1');
    const s2 = document.getElementById('skill2');
    s1.innerHTML = ''; s2.innerHTML = '';

    const skills = classSkillsData[clsName] || ["Akrobatik", "Athletik", "Einblick", "Wahrnehmung"];
    skills.forEach(sk => {
        s1.innerHTML += `<option value="${sk}">${sk}</option>`;
        s2.innerHTML += `<option value="${sk}">${sk}</option>`;
    });
    s1.selectedIndex = 0;
    s2.selectedIndex = skills.length > 1 ? 1 : 0;

    validateSkills();
    updateSpellsUI();
}

function onBgChange() {
    updateBgDynamicUI();
    validateSkills();
}

function onBgAsiModeChange() { updateBgAsiUI(); }

function updateBgDynamicUI() {
    updateBgAsiUI();
    updateBgToolAndEquipmentUI();
}

function updateBgAsiUI() {
    const bgName = document.getElementById('bg-select').value;
    const bgObj = backgrounds[bgName];
    const slotsContainer = document.getElementById('bg-asi-slots');
    const mode = document.getElementById('bg-asi-mode').value;
    
    if (!bgObj || !bgObj.attributes) { slotsContainer.innerHTML = ''; return; }

    slotsContainer.innerHTML = '';
    let optionsHtml = bgObj.attributes.map(attr => `<option value="${attr}">${attrNamesDE[attr] || attr}</option>`).join('');

    if (mode === "2_1") {
        slotsContainer.innerHTML = `
            <div><label style="font-size:0.75rem;">+2 Attribut</label><select id="bg-asi-2" onchange="validateBgAsi()">${optionsHtml}</select></div>
            <div><label style="font-size:0.75rem;">+1 Attribut</label><select id="bg-asi-1a" onchange="validateBgAsi()">${optionsHtml}</select></div>
            <div></div>`;
        const sel1a = document.getElementById('bg-asi-1a');
        if (sel1a && bgObj.attributes.length > 1) sel1a.selectedIndex = 1;
    } else {
        slotsContainer.innerHTML = `
            <div><label style="font-size:0.75rem;">+1</label><select id="bg-asi-1a" onchange="validateBgAsi()">${optionsHtml}</select></div>
            <div><label style="font-size:0.75rem;">+1</label><select id="bg-asi-1b" onchange="validateBgAsi()">${optionsHtml}</select></div>
            <div><label style="font-size:0.75rem;">+1</label><select id="bg-asi-1c" onchange="validateBgAsi()">${optionsHtml}</select></div>`;
        const sel1a = document.getElementById('bg-asi-1a'), sel1b = document.getElementById('bg-asi-1b'), sel1c = document.getElementById('bg-asi-1c');
        if (sel1a && bgObj.attributes.length > 0) sel1a.selectedIndex = 0;
        if (sel1b && bgObj.attributes.length > 1) sel1b.selectedIndex = 1;
        if (sel1c && bgObj.attributes.length > 2) sel1c.selectedIndex = 2;
    }
    validateBgAsi();
}

function updateBgToolAndEquipmentUI() {
    const bgName = document.getElementById('bg-select').value;
    const bgObj = backgrounds[bgName];
    const container = document.getElementById('bg-dynamic-options-container');
    const toolWrapper = document.getElementById('bg-tool-choice-wrapper');
    const toolSelect = document.getElementById('bg-tool-select');
    const eqWrapper = document.getElementById('bg-eq-choice-wrapper');

    if (!bgObj) { container.style.display = 'none'; return; }

    let hasChoices = false;
    if (bgObj.tools && bgObj.tools.choiceA && bgObj.tools.choiceA.options) {
        toolSelect.innerHTML = '';
        bgObj.tools.choiceA.options.forEach(opt => toolSelect.innerHTML += `<option value="${opt}">${opt}</option>`);
        toolWrapper.style.display = 'block';
        hasChoices = true;
    } else { toolWrapper.style.display = 'none'; }

    if (bgObj.equipment && bgObj.equipment.choiceA && bgObj.equipment.choiceB) {
        eqWrapper.style.display = 'block';
        hasChoices = true;
    } else { eqWrapper.style.display = 'none'; }

    container.style.display = hasChoices ? 'block' : 'none';
}

function validateBgAsi() {
    const mode = document.getElementById('bg-asi-mode').value;
    const errElem = document.getElementById('bg-asi-error');
    let isValid = true;
    if (mode === "2_1") {
        if (document.getElementById('bg-asi-2').value === document.getElementById('bg-asi-1a').value) isValid = false;
    } else {
        const v1 = document.getElementById('bg-asi-1a').value, v2 = document.getElementById('bg-asi-1b').value, v3 = document.getElementById('bg-asi-1c').value;
        if (v1 === v2 || v1 === v3 || v2 === v3) isValid = false;
    }
    errElem.style.display = isValid ? 'none' : 'block';
    return isValid;
}

function getBgBonuses() {
    const mode = document.getElementById('bg-asi-mode').value;
    let bonuses = { STR: 0, DEX: 0, CON: 0, INT: 0, WIS: 0, CHA: 0 };
    if (!validateBgAsi()) return bonuses;

    if (mode === "2_1") {
        bonuses[document.getElementById('bg-asi-2').value] += 2;
        bonuses[document.getElementById('bg-asi-1a').value] += 1;
    } else {
        bonuses[document.getElementById('bg-asi-1a').value] += 1;
        bonuses[document.getElementById('bg-asi-1b').value] += 1;
        bonuses[document.getElementById('bg-asi-1c').value] += 1;
    }
    return bonuses;
}

function getSelectedBgEquipmentAndTools(bgName) {
    const bgObj = backgrounds[bgName];
    if (!bgObj) return { tools: [], equipment: [] };

    let tools = bgObj.tools?.choiceA ? [document.getElementById('bg-tool-select').value] : (Array.isArray(bgObj.tools) ? bgObj.tools : [bgObj.tools]);
    let eqMode = document.getElementById('bg-eq-select')?.value || 'A';
    let equipment = eqMode === 'B' ? bgObj.equipment.choiceB : bgObj.equipment.choiceA;
    return { tools: tools.filter(Boolean), equipment: Array.isArray(equipment) ? equipment : [equipment] };
}

function getMod(score) { return Math.floor((score - 10) / 2); }
function onStatsChange() { validateArray(); updateSpellsUI(); }

function validateArray() {
    const vals = Array.from(document.querySelectorAll('.array-select')).map(s => parseInt(s.value)).filter(v => !isNaN(v));
    const isValid = vals.length === 6 && new Set(vals).size === 6;
    document.getElementById('array-error').style.display = isValid ? 'none' : 'block';
    return isValid;
}

function validateSkills() {
    const sk1 = document.getElementById('skill1').value;
    const sk2 = document.getElementById('skill2').value;
    const bgSkills = backgrounds[document.getElementById('bg-select').value]?.skills || [];
    const isValid = (sk1 !== sk2) && !bgSkills.includes(sk1) && !bgSkills.includes(sk2);
    document.getElementById('skill-error').style.display = isValid ? 'none' : 'block';
    return isValid;
}

function updateSpellsUI() {
    const clsName = document.getElementById('class-select').value;
    const cantripGroup = document.getElementById('cantrips-group');
    const lvl1Group = document.getElementById('level1-group');
    cantripGroup.innerHTML = ''; lvl1Group.innerHTML = '';

    const nonCasters = ["Kämpfer", "Barbar", "Schurke", "Mönch"];
    if (nonCasters.includes(clsName)) {
        document.getElementById('cantrip-label').innerText = "Zaubertricks: Keine für diese Klasse.";
        document.getElementById('prep-spells-label').innerText = "Stufe 1 Zauber: Keine für diese Klasse.";
        return;
    }

    let allowedCantrips = classSpellLists[clsName]?.cantrips?.length ? classSpellLists[clsName].cantrips : Object.keys(spellCompendium.cantrips);
    let maxCantrips = (clsName === "Barde" || clsName === "Zauberer" || clsName === "Hexenmeister" || clsName === "Magier" || clsName === "Artifizier" || clsName === "Kleriker" || clsName === "Druide") ? 2 : 0;
    
    document.getElementById('cantrip-label').innerText = `Wähle ${maxCantrips} Zaubertricks:`;
    for (let i = 0; i < maxCantrips; i++) {
        let opts = allowedCantrips.map(c => `<option value="${c}">${c}</option>`).join('');
        cantripGroup.innerHTML += `<div class="input-row"><select class="char-cantrip-select"><option value="">-- Wählen --</option>${opts}</select><button type="button" class="info-btn" onclick="showSpellModalFromDropdown(this.previousElementSibling)">✨</button></div>`;
    }

    let allowedLvl1 = classSpellLists[clsName]?.level1?.length ? classSpellLists[clsName].level1 : Object.keys(spellCompendium.level1);
    let maxPrep = 2;
    document.getElementById('prep-spells-label').innerText = `Wähle Stufe 1 Zauber (Limit: ${maxPrep}):`;

    for (let i = 0; i < maxPrep; i++) {
        let opts = allowedLvl1.map(s => `<option value="${s}">${s}</option>`).join('');
        lvl1Group.innerHTML += `<div class="input-row"><select class="char-spell-select"><option value="">-- Wählen --</option>${opts}</select><button type="button" class="info-btn" onclick="showSpellModalFromDropdown(this.previousElementSibling)">I</button></div>`;
    }
}

function buildCharacter() {
    if (!validateArray() || !validateSkills() || !validateBgAsi()) return alert("Bitte behebe alle Validierungsfehler!");

    const name = document.getElementById('char-name').value || "Unbenannter Held";
    const mainRace = document.getElementById('main-race').value;
    const subRace = document.getElementById('sub-race').value;
    const clsName = document.getElementById('class-select').value;
    const bg = document.getElementById('bg-select').value;
    const subInfo = speciesData[mainRace].subraces[subRace];

    let rawStats = {
        STR: parseInt(document.getElementById('str-val').value),
        DEX: parseInt(document.getElementById('dex-val').value),
        CON: parseInt(document.getElementById('con-val').value),
        INT: parseInt(document.getElementById('int-val').value),
        WIS: parseInt(document.getElementById('wis-val').value),
        CHA: parseInt(document.getElementById('cha-val').value)
    };

    let speciesBonuses = subInfo.bonus || {};
    let bgBonuses = getBgBonuses();
    let bgCustomData = getSelectedBgEquipmentAndTools(bg);

    let stats = { ...rawStats };
    for (let s in stats) {
        if (speciesBonuses[s]) stats[s] += speciesBonuses[s];
        if (bgBonuses[s]) stats[s] += bgBonuses[s];
    }

    let mods = {};
    for (let s in stats) mods[s] = getMod(stats[s]);
    currentCalculatedMods = mods;

    const hpBase = classHpData[clsName]?.base || 8;
    const hp = hpBase + mods.CON;
    const ac = 10 + mods.DEX;

    let chosenCantrips = Array.from(document.querySelectorAll('.char-cantrip-select')).map(s => s.value).filter(Boolean);
    let chosenSpells = Array.from(document.querySelectorAll('.char-spell-select')).map(s => s.value).filter(Boolean);
    const allSkills = [...(backgrounds[bg]?.skills || []), document.getElementById('skill1').value, document.getElementById('skill2').value];

    lastBuiltCharacter = {
        id: 'char_' + Date.now(), name, class: clsName, species: subRace, background: bg,
        level: 1, hp, maxHp: hp, ac, speed: subInfo.speed || 30, stats, mods, skills: allSkills, cantrips: chosenCantrips, spells: chosenSpells, lastAccess: new Date().toISOString()
    };

    markAsUnsaved();

    document.getElementById('screen-out-name').innerHTML = `<i class="fa-solid ${getClassIcon(clsName)}"></i> ${name}`;
    document.getElementById('screen-out-meta').innerText = `${subRace} | ${clsName} Stufe 1 | ${bg}`;
    document.getElementById('screen-out-hp').innerText = `HP: ${hp}`;
    document.getElementById('screen-out-ac').innerText = `RK: ${ac}`;
    document.getElementById('screen-out-init').innerText = `Initiative: ${mods.DEX >= 0 ? '+' : ''}${mods.DEX}`;
    document.getElementById('screen-out-prof').innerText = `Übungsbonus: +2`;
    document.getElementById('screen-out-speed').innerText = `Bewegungsrate: ${subInfo.speed || 30} ft`;

    document.getElementById('screen-out-stats').innerHTML = Object.keys(stats).map(s => `
        <div class="stat-box" onclick="openModal('${s} Wert', '${attributeDescriptions[s]}')">
            <div style="font-size:0.75rem; color:var(--text-muted);">${s}</div>
            <div class="stat-val">${stats[s]}</div>
            <div class="stat-mod">${mods[s] >= 0 ? '+' : ''}${mods[s]}</div>
        </div>`).join('');

    document.getElementById('screen-out-features').innerHTML = `
        <li><b>Fertigkeiten:</b> ${allSkills.join(', ')}</li>
        <li><b>Volksmerkmale:</b><br>${subInfo.text}</li>
        <li><b>Talent:</b> ${backgrounds[bg]?.feat || ''}</li>
        <li><b>Werkzeuge:</b> ${bgCustomData.tools.join(', ') || 'Keine'}</li>
        <li><b>Ausrüstung:</b> ${bgCustomData.equipment.join(', ')}</li>
    `;

    renderEquipmentSectionInSheet(clsName);

    document.getElementById('screen-out-spells').innerHTML = `
        <div style="font-weight:bold; font-size:0.85rem; color:var(--text-muted);">Zaubertricks:</div>
        <div>${chosenCantrips.join(', ') || 'Keine'}</div>
        <div style="margin-top:8px; font-weight:bold; font-size:0.85rem; color:var(--text-muted);">Vorbereitete Stufe 1 Zauber:</div>
        <div>${chosenSpells.join(', ') || 'Keine'}</div>
    `;

    const sheet = document.getElementById('sheet');
    sheet.style.display = 'block';
    sheet.scrollIntoView({ behavior: 'smooth' });
}

function manualSaveCharacter() {
    if (!lastBuiltCharacter) return;
    let list = JSON.parse(localStorage.getItem('dnd_character_list') || '[]');
    list.push(lastBuiltCharacter);
    localStorage.setItem('dnd_character_list', JSON.stringify(list));
    localStorage.setItem('dnd_active_character', JSON.stringify(lastBuiltCharacter));
    
    isSaved = true;
    const adv = document.getElementById('btn-adventure');
    adv.disabled = false; adv.style.background = '#2e7d32'; adv.style.color = '#fff'; adv.style.cursor = 'pointer';
    alert("Held erfolgreich gespeichert!");
}

function startAdventure() {
    if (!isSaved) return alert("Bitte zuerst speichern!");
    window.location.href = 'manager.html';
}

function renderEquipmentSectionInSheet(clsName) {
    const container = document.getElementById('sheet-equipment-controls');
    container.innerHTML = `<div style="font-size:0.85rem;"><b>Feste Startausrüstung:</b> Gemäß Klassenvorgabe in der HTML-Datei.</div>`;
}

// --- DEBUG-KONSOLE ---
const debugBox = document.createElement('div');
debugBox.style.cssText = "position:fixed; bottom:0; left:0; width:100%; max-height:180px; background:black; color:lime; font-size:10px; overflow-y:scroll; z-index:99999; padding:5px; display:none;";
document.body.appendChild(debugBox);

function toggleDebugConsole() {
    debugBox.style.display = debugBox.style.display === 'none' ? 'block' : 'none';
}

window.onerror = function(msg, url, line) {
    debugBox.innerHTML += `<br><span style="color:red;">[FEHLER]</span> ${msg} (Zeile ${line})`;
};
const oldLog = console.log;
console.log = function(...args) {
    debugBox.innerHTML += `<br>[LOG] ${args.join(' ')}`;
    oldLog.apply(console, args);
};
