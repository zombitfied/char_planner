<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gewölbe und Flugechsen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f0ea;
            --surface-color: #ffffff;
            --stone-border: #7c7265;
            --stone-dark: #4e453c;
            --primary-gold: #b8860b;
            --primary-gold-hover: #996515;
            --text-color: #2c221e;
            --text-muted: #6b5b52;
            --danger-color: #a94442;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            background-image: radial-gradient(#e6dbcc 15%, transparent 16%);
            background-size: 20px 20px;
            overflow: hidden;
        }

        .menu-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Raue Stein-Optik mit SVG-Filter Kantenverzerrung */
        .logo-frame {
            background-color: var(--surface-color);
            border: 4px solid var(--stone-border);
            border-radius: 15px 9px 18px 11px;
            padding: 28px 20px;
            position: relative;
            width: 100%;
            box-shadow: 0 10px 25px rgba(44, 34, 30, 0.25), inset 0 0 20px rgba(78, 69, 60, 0.15);
            /* Wendet den Grunge-/Rauheits-Filter auf die Kanten an */
            filter: url(#rough-edge) drop-shadow(2px 3px 4px rgba(44,34,30,0.2));
        }

        /* Feine Textur-Körnung */
        .logo-frame::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.04;
            pointer-events: none;
            border-radius: 12px;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .fantasy-landscape-icons {
            font-size: 1.5rem;
            color: var(--primary-gold);
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        h1 {
            font-size: 1.35rem;
            color: var(--text-color);
            margin: 0 0 4px 0;
            text-transform: uppercase;
            font-family: serif;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-style: italic;
        }

        .btn-rpg {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #faf7f2;
            color: var(--text-color);
            border: 1.5px solid var(--stone-border);
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-decoration: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .btn-rpg:hover {
            background: var(--primary-gold);
            color: #ffffff;
            border-color: var(--primary-gold);
        }

        .btn-rpg.primary {
            background: var(--primary-gold);
            color: #ffffff;
            border-color: #996515;
        }

        /* Modal / Popup-Fenster */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 34, 30, 0.6);
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-card {
            background: var(--surface-color);
            border: 3px solid var(--stone-border);
            border-radius: 10px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: left;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .modal-header h2 {
            font-size: 1.1rem;
            margin: 0;
            color: var(--primary-gold);
            text-transform: uppercase;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .character-list {
            overflow-y: auto;
            max-height: 50vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        .char-item {
            background: #faf7f2;
            border: 1.5px solid var(--stone-border);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .char-item:hover {
            border-color: var(--primary-gold);
            background: #fdfbf7;
        }

        .char-info {
            flex: 1;
            cursor: pointer;
        }

        .char-actions {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }

        .icon-action-btn {
            background: none;
            border: 1.5px solid var(--stone-border);
            border-radius: 4px;
            padding: 6px 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .icon-action-btn:hover {
            background: var(--primary-gold);
            color: #fff;
            border-color: var(--primary-gold);
        }

        .icon-action-btn.delete:hover {
            background: var(--danger-color);
            border-color: var(--danger-color);
        }

        .char-item-title {
            font-weight: bold;
            color: var(--text-color);
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
        }

        .char-item-details {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        @keyframes shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: 200px 0; }
        }

        .skeleton-bar {
            height: 50px;
            border-radius: 6px;
            background: linear-gradient(90deg, #eae3d9 25%, #f4f0ea 50%, #eae3d9 75%);
            background-size: 400px 100%;
            animation: shimmer 1.5s infinite;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <!-- SVG-Filter für den unregelmäßigen, rauen Stein-Kanten-Effekt -->
    <svg style="display:none;">
        <filter id="rough-edge">
            <feturbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="noise" />
            <fedisplacementmap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <div class="menu-container">
        <div class="logo-frame">
            <div class="fantasy-landscape-icons">
                <i class="fa-solid fa-mountain"></i>
                <i class="fa-solid fa-chess-rook"></i>
                <i class="fa-solid fa-dragon"></i>
            </div>

            <h1>Gewölbe und Flugechsen</h1>
            <div class="subtitle">D&D 2024 Regeln & Edition</div>

            <a href="creator.html" class="btn-rpg primary">
                <i class="fa-solid fa-user-plus"></i> Neuen Charakter erstellen
            </a>
            <button class="btn-rpg" onclick="openCharacterModal()">
                <i class="fa-solid fa-scroll"></i> Abenteuer fortsetzen
            </button>
            <button class="btn-rpg" onclick="openGraveyardModal()" style="border-color: var(--stone-border); color: var(--stone-dark);">
                <i class="fa-solid fa-monument"></i> Heldenfriedhof
            </button>
        </div>
    </div>

    <!-- MODAL: Charakter-Auswahl -->
    <div id="char-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Wähle deinen Helden</h2>
                <button class="close-btn" onclick="closeCharacterModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="character-list-container" class="character-list">
                <!-- Wird per JavaScript befüllt -->
            </div>

            <button class="btn-rpg" onclick="closeCharacterModal()" style="margin-bottom: 0;">Abbrechen</button>
        </div>
    </div>

    <!-- MODAL: Heldenfriedhof (Archiv) -->
    <div id="graveyard-modal" class="modal-overlay">
        <div class="modal-card" style="border-color: var(--stone-border);">
            <div class="modal-header">
                <h2 style="color: var(--stone-dark);"><i class="fa-solid fa-monument"></i> Heldenfriedhof</h2>
                <button class="close-btn" onclick="closeGraveyardModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="graveyard-list-container" class="character-list">
                <!-- Wird per JavaScript befüllt -->
            </div>

            <button class="btn-rpg" onclick="closeGraveyardModal()" style="margin-bottom: 0; border-color: var(--stone-border); color: var(--stone-dark);">Schließen</button>
        </div>
    </div>

    <script>
        function getStoredCharacters() {
            let characters = [];
            const savedList = localStorage.getItem('dnd_character_list');
            const singleSaved = localStorage.getItem('dnd_active_character');

            if (savedList) {
                try { characters = JSON.parse(savedList); } catch(e) {}
            } else if (singleSaved) {
                try { characters = [JSON.parse(singleSaved)]; } catch(e) {}
            }

            // Automatische ID-Zuweisung für alte Helden, die noch keine ID hatten (verhindert Bugs beim Archivieren)
            let updated = false;
            characters.forEach((char, index) => {
                if (!char.id) {
                    char.id = 'char_legacy_' + index + '_' + Date.now();
                    updated = true;
                }
            });
            if (updated) {
                saveStoredCharacters(characters);
            }

            return characters;
        }

        function saveStoredCharacters(characters) {
            localStorage.setItem('dnd_character_list', JSON.stringify(characters));
        }

        // --- AKTIVE CHARAKTERE MODAL ---
        function openCharacterModal() {
            const container = document.getElementById('character-list-container');
            container.innerHTML = '';

            const characters = getStoredCharacters().filter(c => !c.archived);

            if (characters.length === 0) {
                container.innerHTML = `
                    <div style="font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-bottom: 8px;">Keine aktiven Helden gefunden...</div>
                    <div class="skeleton-bar"></div>
                    <div class="skeleton-bar"></div>
                `;
            } else {
                characters.forEach((char) => {
                    const item = document.createElement('div');
                    item.className = 'char-item';
                    
                    const lastAccess = char.lastAccess ? new Date(char.lastAccess).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : "Unbekannt";

                    item.innerHTML = `
                        <div class="char-info" onclick="selectCharacter('${char.id}')">
                            <div class="char-item-title">
                                <span><i class="fa-solid fa-shield-halved"></i> ${char.name || "Unbenannter Held"}</span>
                                <span style="color: var(--primary-gold);">Stufe ${char.level || 1}</span>
                            </div>
                            <div class="char-item-details">
                                <span><i class="fa-solid fa-hat-wizard"></i> ${char.class || "-"} (${char.species || "-"})</span>
                                <span><i class="fa-solid fa-clock"></i> ${lastAccess}</span>
                            </div>
                        </div>
                        <div class="char-actions">
                            <button class="icon-action-btn" onclick="archiveCharacter(event, '${char.id}')" title="Ins Archiv (Friedhof) verschieben">
                                <i class="fa-solid fa-monument"></i>
                            </button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            }

            document.getElementById('char-modal').style.display = 'flex';
        }

        function closeCharacterModal() {
            document.getElementById('char-modal').style.display = 'none';
        }

        function selectCharacter(id) {
            let characters = getStoredCharacters();
            const index = characters.findIndex(c => c.id === id);
            if (index >= 0) {
                characters[index].lastAccess = new Date().toISOString();
                saveStoredCharacters(characters);
                localStorage.setItem('dnd_active_character', JSON.stringify(characters[index]));
            }
            window.location.href = 'manager.html';
        }

        function archiveCharacter(event, id) {
            event.stopPropagation();
            let characters = getStoredCharacters();
            const index = characters.findIndex(c => c.id === id);
            if (index >= 0) {
                characters[index].archived = true;
                saveStoredCharacters(characters);
                openCharacterModal();
            }
        }

        // --- FRIEDHOF (ARCHIV) MODAL ---
        function openGraveyardModal() {
            const container = document.getElementById('graveyard-list-container');
            container.innerHTML = '';

            const characters = getStoredCharacters().filter(c => c.archived);

            if (characters.length === 0) {
                container.innerHTML = `
                    <div style="font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 20px;">Der Friedhof ist leer. Noch ruht kein Held in Frieden...</div>
                `;
            } else {
                characters.forEach((char) => {
                    const item = document.createElement('div');
                    item.className = 'char-item';
                    
                    const lastAccess = char.lastAccess ? new Date(char.lastAccess).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) : "Unbekannt";

                    item.innerHTML = `
                        <div class="char-info" onclick="selectArchivedCharacter('${char.id}')">
                            <div class="char-item-title" style="color: var(--stone-dark);">
                                <span><i class="fa-solid fa-ghost"></i> ${char.name || "Unbenannter Held"}</span>
                                <span style="font-size: 0.8rem;">Stufe ${char.level || 1}</span>
                            </div>
                            <div class="char-item-details">
                                <span>${char.class || "-"} (${char.species || "-"})</span>
                                <span>Ruht seit: ${lastAccess}</span>
                            </div>
                        </div>
                        <div class="char-actions">
                            <button class="icon-action-btn" onclick="restoreCharacter(event, '${char.id}')" title="Wiederbeleben & Laden">
                                <i class="fa-solid fa-wand-magic-sparkles"></i>
                            </button>
                            <button class="icon-action-btn delete" onclick="deleteCharacterPermanently(event, '${char.id}')" title="Endgültig löschen">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            }

            document.getElementById('graveyard-modal').style.display = 'flex';
        }

        function closeGraveyardModal() {
            document.getElementById('graveyard-modal').style.display = 'none';
        }

        function selectArchivedCharacter(id) {
            let characters = getStoredCharacters();
            const index = characters.findIndex(c => c.id === id);
            if (index >= 0) {
                delete characters[index].archived;
                characters[index].lastAccess = new Date().toISOString();
                saveStoredCharacters(characters);
                localStorage.setItem('dnd_active_character', JSON.stringify(characters[index]));
            }
            window.location.href = 'manager.html';
        }

        function restoreCharacter(event, id) {
            event.stopPropagation();
            let characters = getStoredCharacters();
            const index = characters.findIndex(c => c.id === id);
            if (index >= 0) {
                delete characters[index].archived;
                saveStoredCharacters(characters);
                openGraveyardModal();
            }
        }

        function deleteCharacterPermanently(event, id) {
            event.stopPropagation();
            if (confirm("Möchtest du diesen Helden wirklich endgültig aus dem Buch der Toten löschen?")) {
                let characters = getStoredCharacters();
                characters = characters.filter(c => c.id !== id);
                saveStoredCharacters(characters);
                openGraveyardModal();
            }
        }
    </script>
</body>
</html>
