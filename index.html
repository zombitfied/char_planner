<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 2024 - Heldenarchiv</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f0ea;
            --surface-color: #ffffff;
            --surface-border: #d4c5b9;
            --primary-gold: #b8860b;
            --primary-gold-hover: #996515;
            --text-color: #2c221e;
            --text-muted: #6b5b52;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#e6dbcc 15%, transparent 16%);
            background-size: 20px 20px;
        }

        .menu-container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            text-align: center;
        }

        .logo-frame {
            background-color: var(--surface-color);
            border: 2px solid var(--surface-border);
            border-radius: 12px;
            padding: 28px 20px;
            box-shadow: 0 8px 24px rgba(44, 34, 30, 0.1);
        }

        .fantasy-landscape-icons {
            font-size: 1.5rem;
            color: var(--primary-gold);
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-color);
            margin: 0 0 4px 0;
            text-transform: uppercase;
            font-family: serif;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-style: italic;
        }

        .btn-rpg {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #faf7f2;
            color: var(--text-color);
            border: 1px solid var(--primary-gold);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-decoration: none;
        }

        .btn-rpg:hover {
            background: var(--primary-gold);
            color: #ffffff;
        }

        .btn-rpg.primary {
            background: var(--primary-gold);
            color: #ffffff;
        }

        /* Modal / Popup-Fenster */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 34, 30, 0.6);
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-card {
            background: var(--surface-color);
            border: 2px solid var(--primary-gold);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: left;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .modal-header h2 {
            font-size: 1.1rem;
            margin: 0;
            color: var(--primary-gold);
            text-transform: uppercase;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .character-list {
            overflow-y: auto;
            max-height: 50vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        .char-item {
            background: #faf7f2;
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .char-item:hover {
            border-color: var(--primary-gold);
            background: #fdfbf7;
            transform: translateY(-1px);
        }

        .char-item-title {
            font-weight: bold;
            color: var(--text-color);
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
        }

        .char-item-details {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        @keyframes shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: 200px 0; }
        }

        .skeleton-bar {
            height: 50px;
            border-radius: 6px;
            background: linear-gradient(90deg, #eae3d9 25%, #f4f0ea 50%, #eae3d9 75%);
            background-size: 400px 100%;
            animation: shimmer 1.5s infinite;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <div class="logo-frame">
            <div class="fantasy-landscape-icons">
                <i class="fa-solid fa-mountain"></i>
                <i class="fa-solid fa-chess-rook"></i>
                <i class="fa-solid fa-dragon"></i>
            </div>

            <h1>Heldenarchiv</h1>
            <div class="subtitle">D&D 2024 Regeln & Edition</div>

            <a href="creator.html" class="btn-rpg primary">
                <i class="fa-solid fa-user-plus"></i> Neuen Charakter erstellen
            </a>
            <button class="btn-rpg" onclick="openCharacterModal()">
                <i class="fa-solid fa-scroll"></i> Abenteuer fortsetzen
            </button>
        </div>
    </div>

    <!-- MODAL: Charakter-Auswahl -->
    <div id="char-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Wähle deinen Helden</h2>
                <button class="close-btn" onclick="closeCharacterModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="character-list-container" class="character-list">
                <!-- Wird per JavaScript befüllt -->
            </div>

            <button class="btn-rpg" onclick="closeCharacterModal()" style="margin-bottom: 0;">Abbrechen</button>
        </div>
    </div>

    <script>
        function openCharacterModal() {
            const container = document.getElementById('character-list-container');
            container.innerHTML = '';

            let characters = [];
            const savedList = localStorage.getItem('dnd_character_list');
            const singleSaved = localStorage.getItem('dnd_active_character');

            if (savedList) {
                try { characters = JSON.parse(savedList); } catch(e) {}
            } else if (singleSaved) {
                try { characters = [JSON.parse(singleSaved)]; } catch(e) {}
            }

            if (characters.length === 0) {
                container.innerHTML = `
                    <div style="font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-bottom: 8px;">Keine Helden im Archiv gefunden...</div>
                    <div class="skeleton-bar"></div>
                    <div class="skeleton-bar"></div>
                `;
            } else {
                characters.forEach((char, index) => {
                    const item = document.createElement('div');
                    item.className = 'char-item';
                    item.onclick = () => selectCharacter(index);
                    
                    const lastAccess = char.lastAccess ? new Date(char.lastAccess).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : "Unbekannt";

                    item.innerHTML = `
                        <div class="char-item-title">
                            <span><i class="fa-solid fa-shield-halved"></i> ${char.name || "Unbenannter Held"}</span>
                            <span style="color: var(--primary-gold);">Stufe ${char.level || 1}</span>
                        </div>
                        <div class="char-item-details">
                            <span><i class="fa-solid fa-hat-wizard"></i> ${char.class || "-"} (${char.species || "-"})</span>
                            <span><i class="fa-solid fa-clock"></i> ${lastAccess}</span>
                        </div>
                    `;
                    container.appendChild(item);
                });
            }

            document.getElementById('char-modal').style.display = 'flex';
        }

        function closeCharacterModal() {
            document.getElementById('char-modal').style.display = 'none';
        }

        function selectCharacter(index) {
            let characters = [];
            const savedList = localStorage.getItem('dnd_character_list');
            if (savedList) {
                characters = JSON.parse(savedList);
                // Zeitstempel bei Auswahl aktualisieren
                characters[index].lastAccess = new Date().toISOString();
                localStorage.setItem('dnd_character_list', JSON.stringify(characters));
                localStorage.setItem('dnd_active_character', JSON.stringify(characters[index]));
            }
            window.location.href = 'manager.html';
        }
    </script>
</body>
</html>
