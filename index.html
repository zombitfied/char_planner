<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gewölbe und Flugechsen</title>
    
    <!-- Theme vor dem Rendern setzen, um Farblitzen zu verhindern -->
    <script>
        const savedTheme = localStorage.getItem('dnd_theme') || 'standard';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Zentrales Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Nur layoutspezifische Ausnahmen für die Startseite (Zentrierung) */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 16px;
        }
        .menu-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- SVG-Filter für den grisselig-rauhen Kanten-Effekt -->
    <svg style="display:none;" aria-hidden="true">
        <filter id="rough-edge">
            <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <div class="menu-container">
        <div class="logo-frame">
            <!-- Pinsel-Button oben rechts -->
            <button class="btn-theme-toggle" onclick="openThemeModal()" title="Design wählen">
                <i class="fa-solid fa-paintbrush"></i>
            </button>

            <div class="fantasy-landscape-icons" style="font-size: 1.5rem; color: var(--accent); margin-bottom: 12px; display: flex; justify-content: center; gap: 16px;">
                <i class="fa-solid fa-mountain"></i>
                <i class="fa-solid fa-chess-rook"></i>
                <i class="fa-solid fa-dragon"></i>
            </div>

            <h1 style="font-size: 1.35rem; color: var(--text); margin: 0 0 4px 0; text-transform: uppercase; font-family: serif; letter-spacing: 0.5px;">Gewölbe und Flugechsen</h1>
            <div class="subtitle" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; font-style: italic;">D&D 2024 Regeln & Edition</div>

            <!-- Oberer Button mit der neuen, rahmen-sicheren Klasse -->
            <a href="creator.html" class="btn-menu-main">
                <i class="fa-solid fa-user-plus"></i> Helden erschaffen
            </a>
            
            <button class="btn-menu-main" onclick="openCharacterModal()">
                <i class="fa-solid fa-scroll"></i> Abenteuer fortsetzen
            </button>
            
            <button class="btn-menu-main" onclick="openGraveyardModal()" style="color: var(--text-muted); margin-bottom: 0;">
                <i class="fa-solid fa-monument"></i> Heldenfriedhof
            </button>
        </div>
    </div>

    <!-- MODAL: Design / Theme Auswahl -->
    <div id="theme-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">
                <span>Design wählen</span>
                <button class="close-btn" onclick="closeThemeModal()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="modal-body" style="overflow: visible;">
                <button class="theme-option-btn" onclick="setTheme('standard')">
                    <span><i class="fa-solid fa-scroll" style="color: var(--accent); margin-right: 8px;"></i> Standard (Pergament)</span>
                    <i class="fa-solid fa-check" id="check-standard" style="display:none; color: var(--accent);"></i>
                </button>
                <button class="theme-option-btn" onclick="setTheme('dungeon')">
                    <span><i class="fa-solid fa-moon" style="color: var(--accent); margin-right: 8px;"></i> Dungeon (Dark Mode)</span>
                    <i class="fa-solid fa-check" id="check-dungeon" style="display:none; color: var(--accent);"></i>
                </button>
            </div>

            <button class="main-btn" onclick="closeThemeModal()" style="margin-top: 10px;">Schließen</button>
        </div>
    </div>

    <!-- MODAL: Charakter-Auswahl -->
    <div id="char-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">
                <span>Wähle deinen Helden</span>
                <button class="close-btn" onclick="closeCharacterModal()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="character-list-container" class="modal-body" style="max-height: 40vh; display: flex; flex-direction: column; gap: 10px;"></div>

            <button class="main-btn" onclick="closeCharacterModal()" style="margin-top: 10px; background: var(--btn-back-bg); color: var(--text); border: 1.5px solid var(--border);">Abbrechen</button>
        </div>
    </div>

    <!-- MODAL: Heldenfriedhof -->
    <div id="graveyard-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">
                <span><i class="fa-solid fa-monument"></i> Heldenfriedhof</span>
                <button class="close-btn" onclick="closeGraveyardModal()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="graveyard-list-container" class="modal-body" style="max-height: 40vh; display: flex; flex-direction: column; gap: 10px;"></div>

            <button class="main-btn" onclick="closeGraveyardModal()" style="margin-top: 10px; background: var(--btn-back-bg); color: var(--text); border: 1.5px solid var(--border);">Schließen</button>
        </div>
    </div>

    <script>
        // --- THEME STEUERUNG ---
        function openThemeModal() {
            const current = localStorage.getItem('dnd_theme') || 'standard';
            document.getElementById('check-standard').style.display = current === 'standard' ? 'inline' : 'none';
            document.getElementById('check-dungeon').style.display = current === 'dungeon' ? 'inline' : 'none';
            document.getElementById('theme-modal').style.display = 'flex';
        }
        function closeThemeModal() { document.getElementById('theme-modal').style.display = 'none'; }
        function setTheme(themeName) {
            localStorage.setItem('dnd_theme', themeName);
            document.documentElement.setAttribute('data-theme', themeName);
            closeThemeModal();
        }

        // --- CHARAKTER LOGIK ---
        function getStoredCharacters() {
            let characters = [];
            const savedList = localStorage.getItem('dnd_character_list');
            const singleSaved = localStorage.getItem('dnd_active_character');

            if (savedList) {
                try { characters = JSON.parse(savedList); } catch(e) {}
            } else if (singleSaved) {
                try { characters = [JSON.parse(singleSaved)]; } catch(e) {}
            }

            let updated = false;
            characters.forEach((char, index) => {
                if (!char.id) {
                    char.id = 'char_legacy_' + index + '_' + Date.now();
                    updated = true;
                }
            });
            if (updated) {
                saveStoredCharacters(characters);
            }

            return characters;
        }

        function saveStoredCharacters(characters) {
            localStorage.setItem('dnd_character_list', JSON.stringify(characters));
        }

        function openCharacterModal() {
            const container = document.getElementById('character-list-container');
            container.innerHTML = '';

            const characters = getStoredCharacters().filter(c => !c.archived);

            if (characters.length === 0) {
                container.innerHTML = `<div style="font-size: 0.85rem; color: var(--text-muted); text-align: center;">Keine aktiven Helden gefunden...</div>`;
            } else {
                characters.forEach((char) => {
                    const item = document.createElement('div');
                    item.style.cssText = "background: var(--btn-back-bg); border: 1.5px solid var(--border); border-radius: 6px; padding: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;";
                    item.onclick = () => selectCharacter(char.id);
                    
                    item.innerHTML = `
                        <div>
                            <div style="font-weight: bold; color: var(--text);">${char.name || "Held"} (Stufe ${char.level || 1})</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted);">${char.class || "-"} | ${char.species || "-"}</div>
                        </div>
                        <button onclick="archiveCharacter(event, '${char.id}')" style="background:none; border:1.5px solid var(--border); border-radius:4px; padding:6px; color:var(--text-muted); cursor:pointer;" title="Ins Archiv verschieben"><i class="fa-solid fa-monument"></i></button>
                    `;
                    container.appendChild(item);
                });
            }

            document.getElementById('char-modal').style.display = 'flex';
        }

        function closeCharacterModal() {
            document.getElementById('char-modal').style.display = 'none';
        }

        function selectCharacter(id) {
            let characters = getStoredCharacters();
            const index = characters.findIndex(c => c.id === id);
            if (index >= 0) {
                characters[index].lastAccess = new Date().toISOString();
                saveStoredCharacters(characters);
                localStorage.setItem('dnd_active_character', JSON.stringify(characters[index]));
            }
            window.location.href = 'manager.html';
        }

        function archiveCharacter(event, id) {
            event.stopPropagation();
            let characters = getStoredCharacters();
            const index = characters.findIndex(c => c.id === id);
            if (index >= 0) {
                characters[index].archived = true;
                saveStoredCharacters(characters);
                openCharacterModal();
            }
        }

        // --- FRIEDHOF LOGIK ---
        function openGraveyardModal() {
            const container = document.getElementById('graveyard-list-container');
            container.innerHTML = '';

            const characters = getStoredCharacters().filter(c => c.archived);

            if (characters.length === 0) {
                container.innerHTML = `<div style="font-size: 0.85rem; color: var(--text-muted); text-align: center;">Der Friedhof ist leer.</div>`;
            } else {
                characters.forEach((char) => {
                    const item = document.createElement('div');
                    item.style.cssText = "background: var(--btn-back-bg); border: 1.5px solid var(--border); border-radius: 6px; padding: 10px; display: flex; justify-content: space-between; align-items: center;";
                    
                    item.innerHTML = `
                        <div>
                            <div style="font-weight: bold; color: var(--text);">${char.name || "Held"}</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted);">${char.class || "-"}</div>
                        </div>
                        <div style="display: flex; gap: 6px;">
                            <button onclick="restoreCharacter(event, '${char.id}')" style="background:none; border:1.5px solid var(--border); border-radius:4px; padding:6px; color:var(--text-muted); cursor:pointer;" title="Wiederbeleben"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
                            <button onclick="deleteCharacterPermanently(event, '${char.id}')" style="background:none; border:1.5px solid var(--border); border-radius:4px; padding:6px; color:#a94442; cursor:pointer;" title="Löschen"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            }

            document.getElementById('graveyard-modal').style.display = 'flex';
        }

        function closeGraveyardModal() {
            document.getElementById('graveyard-modal').style.display = 'none';
        }

        function restoreCharacter(event, id) {
            event.stopPropagation();
            let characters = getStoredCharacters();
            const index = characters.findIndex(c => c.id === id);
            if (index >= 0) {
                delete characters[index].archived;
                saveStoredCharacters(characters);
                openGraveyardModal();
            }
        }

        function deleteCharacterPermanently(event, id) {
            event.stopPropagation();
            if (confirm("Endgültig löschen?")) {
                let characters = getStoredCharacters();
                characters = characters.filter(c => c.id !== id);
                saveStoredCharacters(characters);
                openGraveyardModal();
            }
        }
    </script>
</body>
</html>
