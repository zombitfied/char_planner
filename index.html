<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 2024 - Heldenarchiv</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f0ea;
            --surface-color: #ffffff;
            --surface-border: #d4c5b9;
            --primary-gold: #b8860b;
            --primary-gold-hover: #996515;
            --text-color: #2c221e;
            --text-muted: #6b5b52;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#e6dbcc 15%, transparent 16%);
            background-size: 20px 20px;
        }

        .menu-container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            text-align: center;
        }

        .logo-frame {
            background-color: var(--surface-color);
            border: 2px solid var(--surface-border);
            border-radius: 12px;
            padding: 28px 20px;
            box-shadow: 0 8px 24px rgba(44, 34, 30, 0.1);
        }

        .fantasy-landscape-icons {
            font-size: 1.5rem;
            color: var(--primary-gold);
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-color);
            margin: 0 0 4px 0;
            text-transform: uppercase;
            font-family: serif;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-style: italic;
        }

        .btn-rpg {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #faf7f2;
            color: var(--text-color);
            border: 1px solid var(--primary-gold);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-decoration: none;
        }

        .btn-rpg.primary {
            background: var(--primary-gold);
            color: #ffffff;
        }

        .char-preview {
            background: #faf7f2;
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 0.85rem;
            display: none;
        }

        .char-preview span {
            color: var(--primary-gold);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <div class="logo-frame">
            <div class="fantasy-landscape-icons">
                <i class="fa-solid fa-mountain"></i>
                <i class="fa-solid fa-chess-rook"></i>
                <i class="fa-solid fa-dragon"></i>
            </div>

            <h1>Heldenarchiv</h1>
            <div class="subtitle">D&D 2024 Regeln & Edition</div>

            <div id="preview-box" class="char-preview">
                <div><i class="fa-solid fa-user-shield"></i> Letzter Held: <span id="prev-name">-</span></div>
                <div><i class="fa-solid fa-hat-wizard"></i> Klasse: <span id="prev-class">-</span> (Stufe <span id="prev-level">1</span>)</div>
            </div>

            <a href="creator.html" class="btn-rpg primary">
                <i class="fa-solid fa-user-plus"></i> Neuen Charakter erstellen
            </a>
            <button id="btn-load" class="btn-rpg" onclick="loadCharacter()" style="display: none;">
                <i class="fa-solid fa-scroll"></i> Abenteuer fortsetzen
            </button>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('dnd_active_character');
            if (saved) {
                try {
                    const char = JSON.parse(saved);
                    document.getElementById('prev-name').innerText = char.name || "Unbenannt";
                    document.getElementById('prev-class').innerText = char.class || "-";
                    document.getElementById('prev-level').innerText = char.level || 1;
                    document.getElementById('preview-box').style.display = 'block';
                    document.getElementById('btn-load').style.display = 'flex';
                } catch (e) {
                    console.error(e);
                }
            }
        });

        function loadCharacter() {
            if (localStorage.getItem('dnd_active_character')) {
                window.location.href = 'manager.html';
            }
        }
    </script>
</body>
</html>
